name: Revolution Medicines
description: 'Revolution Medicines is a clinical-stage precision oncology company headquartered
  in Redwood City, California, developing targeted therapies for RAS-addicted cancers.
  Its pipeline centers on RAS(ON) inhibitors — including daraxonrasib (RMC-6236),
  zoldonrasib (RMC-9805), and elironrasib (RMC-6291) — designed to directly target
  the active, GTP-bound (ON) state of oncogenic RAS proteins across mutations such
  as KRAS G12X. The company pairs structure-based drug discovery with clinical development
  to pursue treatments for pancreatic, lung, colorectal, and other RAS-driven tumors.
  Revolution Medicines is a publicly traded corporate entity (Nasdaq: RVMD) and does
  not currently expose a public developer API surface; this profile captures its identity
  and domain-security posture for the API Evangelist network.'
